<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Chợ Đồ Cũ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: #f1f5f9; }
        .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .auth-card { width: min(100%, 560px); border: 0; border-radius: 18px; overflow: hidden; }
        .auth-header { background: #0f172a; color: #fff; padding: 28px; }
        .social-divider { display: flex; align-items: center; gap: 12px; color: #64748b; font-size: .875rem; }
        .social-divider::before, .social-divider::after { content: ""; height: 1px; flex: 1; background: #e2e8f0; }
        .social-login { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        @media (max-width: 420px) { .social-login { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main class="auth-page">
        <section class="card auth-card shadow">
            <div class="auth-header">
                <a href="/" class="brand-logo text-white text-decoration-none"><i class="bi bi-recycle"></i> CHỢ ĐỒ CŨ</a>
                <h1 id="authTitle" class="h3 mt-4 mb-2">Đăng nhập tài khoản</h1>
                <p id="authSubtitle" class="mb-0 text-white-50">Tiếp tục mua bán đồ cũ an toàn.</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <div class="btn-group w-100 mb-4" role="group">
                    <button id="loginTab" class="btn btn-primary" type="button">Đăng nhập</button>
                    <button id="registerTab" class="btn btn-outline-primary" type="button">Đăng ký</button>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại hoặc email</label>
                        <input id="loginIdentifier" class="form-control" required autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <input id="loginPassword" type="password" class="form-control" required autocomplete="current-password">
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
                </form>

                <div id="socialLoginSection" class="mt-4">
                    <div class="social-divider mb-3">hoặc đăng nhập bằng</div>
                    <div class="social-login">
                        <button class="btn btn-outline-danger social-login-button" type="button" data-provider="google">
                            <i class="bi bi-google me-1"></i> Google
                        </button>
                        <button class="btn btn-outline-primary social-login-button" type="button" data-provider="facebook">
                            <i class="bi bi-facebook me-1"></i> Facebook
                        </button>
                        <button id="appleLoginButton" class="btn btn-dark social-login-button" type="button" data-provider="apple">
                            <i class="bi bi-apple me-1"></i> Apple
                        </button>
                    </div>
                </div>

                <form id="registerForm" class="d-none">
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input id="registerPhone" type="tel" class="form-control" required autocomplete="tel"
                               inputmode="numeric" pattern="0[0-9]{9}" maxlength="10"
                               title="Số điện thoại không hợp lệ">
                        <button id="checkPhoneButton" class="btn btn-outline-primary w-100 mt-2" type="button">Tiếp tục</button>
                    </div>
                    <div id="registerDetails" class="d-none">
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input id="registerName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input id="registerEmail" type="email" class="form-control" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu (ít nhất 6 ký tự)</label>
                            <input id="registerPassword" type="password" minlength="6" class="form-control" required autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tỉnh/thành phố</label>
                            <select id="registerProvince" class="form-select" required>
                                <option value="">Đang tải tỉnh/thành phố...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phường/xã</label>
                            <select id="registerWard" class="form-select" required disabled>
                                <option value="">Chọn tỉnh/thành phố trước</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ chi tiết</label>
                            <input id="registerAddress" class="form-control" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Tạo tài khoản</button>
                    </div>
                </form>

                <div id="authMessage" class="alert d-none mt-3 mb-0"></div>
                <a href="/" class="d-block text-center mt-4 text-decoration-none">← Về trang chủ</a>
            </div>
        </section>
    </main>
    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const message = document.getElementById('authMessage');
        const title = document.getElementById('authTitle');
        const subtitle = document.getElementById('authSubtitle');
        const socialLoginSection = document.getElementById('socialLoginSection');
        const appleLoginButton = document.getElementById('appleLoginButton');
        const registerDetails = document.getElementById('registerDetails');
        const checkPhoneButton = document.getElementById('checkPhoneButton');

        function showMessage(text, type = 'danger') {
            message.textContent = text;
            message.className = `alert alert-${type} mt-3 mb-0`;
        }
        function setMode(mode) {
            const register = mode === 'register';
            loginForm.classList.toggle('d-none', register);
            registerForm.classList.toggle('d-none', !register);
            loginTab.className = register ? 'btn btn-outline-primary' : 'btn btn-primary';
            registerTab.className = register ? 'btn btn-primary' : 'btn btn-outline-primary';
            title.textContent = register ? 'Tạo tài khoản mới' : 'Đăng nhập tài khoản';
            subtitle.textContent = register ? 'Đăng ký để mua bán đồ cũ dễ dàng.' : 'Tiếp tục mua bán đồ cũ an toàn.';
            document.title = register ? 'Đăng ký - Chợ Đồ Cũ' : 'Đăng nhập - Chợ Đồ Cũ';
            socialLoginSection.classList.toggle('d-none', register);
            if (!register) {
                registerDetails.classList.add('d-none');
                checkPhoneButton.disabled = false;
            }
            message.className = 'alert d-none mt-3 mb-0';
        }
        async function request(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Yêu cầu không thành công.');
            return data;
        }
        async function loadProvinces() {
            const provinceSelect = document.getElementById('registerProvince');
            try {
                const response = await fetch('https://provinces.open-api.vn/api/p/');
                if (!response.ok) throw new Error('Không thể tải danh sách tỉnh/thành phố.');
                const provinces = await response.json();
                provinceSelect.innerHTML = '<option value="">-- Chọn tỉnh/thành phố --</option>';
                provinces.sort((a, b) => a.name.localeCompare(b.name, 'vi')).forEach(province => {
                    const option = document.createElement('option');
                    option.value = province.code;
                    option.textContent = province.name;
                    provinceSelect.appendChild(option);
                });
            } catch (error) {
                provinceSelect.innerHTML = '<option value="">Không tải được danh sách</option>';
                showMessage(`${error.message} Bạn có thể tải lại trang để thử lại.`);
            }
        }
        async function loadWards(provinceCode) {
            const wardSelect = document.getElementById('registerWard');
            wardSelect.disabled = true;
            wardSelect.innerHTML = '<option value="">Đang tải phường/xã...</option>';
            if (!provinceCode) {
                wardSelect.innerHTML = '<option value="">Chọn tỉnh/thành phố trước</option>';
                return;
            }
            try {
                const response = await fetch(`https://provinces.open-api.vn/api/p/${encodeURIComponent(provinceCode)}?depth=2`);
                if (!response.ok) throw new Error('Không thể tải danh sách phường/xã.');
                const province = await response.json();
                wardSelect.innerHTML = '<option value="">-- Chọn phường/xã --</option>';
                (province.districts || []).forEach(district => {
                    (district.wards || []).forEach(ward => {
                        const option = document.createElement('option');
                        option.value = `${ward.name}, ${district.name}`;
                        option.textContent = `${ward.name} (${district.name})`;
                        wardSelect.appendChild(option);
                    });
                });
                wardSelect.disabled = wardSelect.options.length <= 1;
            } catch (error) {
                wardSelect.innerHTML = '<option value="">Không tải được danh sách</option>';
                showMessage(`${error.message} Bạn có thể tải lại trang để thử lại.`);
            }
        }
        loginTab.onclick = () => setMode('login');
        registerTab.onclick = () => setMode('register');
        checkPhoneButton.onclick = async () => {
            const phone = document.getElementById('registerPhone').value.trim();
            if (!/^0\d{9}$/.test(phone)) {
                showMessage('Số điện thoại không hợp lệ.');
                return;
            }
            checkPhoneButton.disabled = true;
            checkPhoneButton.textContent = 'Đang kiểm tra...';
            try {
                const phoneCheck = await request('/api/auth/check-phone', { soDienThoai: phone });
                if (phoneCheck.exists) {
                    throw new Error('Số điện thoại này đã được đăng ký.');
                }
                sessionStorage.setItem('registrationPhone', phone);
                window.location.href = '/auth-register.html';
            } catch (error) {
                showMessage(error.message);
            } finally {
                checkPhoneButton.disabled = false;
                checkPhoneButton.textContent = 'Kiểm tra lại số điện thoại';
            }
        };
        document.getElementById('registerPhone').addEventListener('input', () => {
            const phoneInput = document.getElementById('registerPhone');
            phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, 10);
            registerDetails.classList.add('d-none');
            checkPhoneButton.textContent = 'Tiếp tục';
            message.className = 'alert d-none mt-3 mb-0';
        });
        document.getElementById('registerProvince').addEventListener('change', event => {
            loadWards(event.target.value);
        });
        document.querySelectorAll('.social-login-button').forEach(button => {
            button.onclick = async () => {
                const provider = button.dataset.provider;
                button.disabled = true;
                try {
                    const response = await fetch(`/api/auth/social/${provider}`, { method: 'POST' });
                    const data = await response.json();
                    if (!response.ok || !data.authorizationUrl) {
                        throw new Error(data.message || `Đăng nhập ${provider} chưa sẵn sàng.`);
                    }
                    window.location.href = data.authorizationUrl;
                } catch (error) {
                    showMessage(error.message);
                    button.disabled = false;
                }
            };
        });
        if (/android/i.test(navigator.userAgent)) {
            appleLoginButton.classList.add('d-none');
        }
        loginForm.onsubmit = async event => {
            event.preventDefault();
            try {
                const data = await request('/api/auth/login', {
                    identifier: document.getElementById('loginIdentifier').value.trim(),
                    matKhau: document.getElementById('loginPassword').value
                });
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (error) {
                showMessage(error.message);
            }
        };
        registerForm.onsubmit = async event => {
            event.preventDefault();
            try {
                const phone = document.getElementById('registerPhone').value.trim();
                if (registerDetails.classList.contains('d-none')) {
                    throw new Error('Vui lòng kiểm tra số điện thoại trước.');
                }
                const provinceSelect = document.getElementById('registerProvince');
                const wardSelect = document.getElementById('registerWard');
                const data = await request('/api/auth/register', {
                    hoTen: document.getElementById('registerName').value.trim(),
                    email: document.getElementById('registerEmail').value.trim(),
                    soDienThoai: phone,
                    matKhau: document.getElementById('registerPassword').value,
                    tinhThanh: provinceSelect.options[provinceSelect.selectedIndex]?.textContent.trim(),
                    phuongXa: wardSelect.value.trim(),
                    quanHuyen: null,
                    diaChiChiTiet: document.getElementById('registerAddress').value.trim()
                });
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (error) {
                showMessage(error.message);
            }
        };
        loadProvinces();
        setMode(new URLSearchParams(window.location.search).get('mode') === 'register' ? 'register' : 'login');
    </script>
</body>
</html>
